[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artisan-ha-bridge"
dynamic = ["version"]
description = "Bridge between the Artisan roaster scope and Home Assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jonathan" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.9",
    "zeroconf>=0.132",
    # Already pulled in by zeroconf; listed because discovery enumerates interfaces with it directly.
    "ifaddr>=0.2",
    "platformdirs>=4",
    "pyyaml>=6",
]

[project.optional-dependencies]
watch = ["watchdog>=4"]
dev = [
    "artisan-ha-bridge[watch]",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML",
]

[project.scripts]
artisan-ha-bridge = "artisan_ha_bridge.__main__:main"

[tool.hatch.version]
path = "src/artisan_ha_bridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/artisan_ha_bridge"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "service", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT",
    "C4", "PIE", "RET", "PL", "TRY", "PERF", "S", "DTZ", "LOG", "G", "T20", "ANN",
]
ignore = [
    "PLR2004",  # magic values are fine in tests and protocol constants
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # complexity limits fight the explicit state table
    "TRY003",
    "TRY004",   # ValueError is the right type for malformed data read from files   # long exception messages are clearer than one-off exception classes
    "S104",     # binding 0.0.0.0 is the documented default for the HA server
]

[tool.ruff.lint.isort]
known-first-party = ["artisan_ha_bridge"]
known-local-folder = ["helpers"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN401", "PLC0415", "S311", "T20"]
"src/artisan_ha_bridge/__main__.py" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src:tests"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Plain `pytest` enforces the M1 requirement: 100% branch coverage on state.py.
# For a whole-package report: pytest --cov=artisan_ha_bridge --cov-fail-under=0
addopts = "--cov=artisan_ha_bridge.state --cov-branch --cov-report=term-missing --cov-fail-under=100"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
